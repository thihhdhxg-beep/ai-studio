<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ Jihad - Multi-Agent Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #030712; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 15px; width: 100%; max-width: 1000px; }
        header h1 { color: #38bdf8; font-size: 1.8rem; }
        .studio-room { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; }
        .agents-chain { display: flex; justify-content: space-between; gap: 10px; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .agent-desk { flex: 1; background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; border: 2px solid #334155; }
        .agent-desk.active { border-color: #38bdf8; }
        .laptop-box { background: #020617; color: #4ade80; padding: 8px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; height: 50px; overflow: hidden; text-align: left; margin-top: 8px; }
        .control-panel { background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .chain-status-log { background: #020617; color: #cbd5e1; padding: 15px; border-radius: 8px; font-family: monospace; height: 120px; overflow-y: auto; margin-bottom: 15px; white-space: pre-wrap; }
        .input-box { display: flex; gap: 12px; }
        .input-box input { flex: 1; padding: 14px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 8px; }
        .input-box button { background: #0284c7; color: white; border: none; padding: 14px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .preview-box { background: #fff; border-radius: 12px; height: 450px; overflow: hidden; }
        #web-preview { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <header>
        <h1>AI MULTI-AGENT CHAIN STUDIO</h1>
        <p>Vercel সার্ভারলেস অটো মোড - কোনো কি ছাড়াই কাজ করবে, বস!</p>
    </header>

    <div class="studio-room">
        <div class="agents-chain">
            <div class="agent-desk" id="desk-nexus">
                <h3>Nexus</h3>
                <div class="laptop-box" id="screen-nexus">Ready...</div>
            </div>
            <div class="agent-desk" id="desk-cipher">
                <h3>Cipher</h3>
                <div class="laptop-box" id="screen-cipher">Waiting...</div>
            </div>
            <div class="agent-desk" id="desk-glitch">
                <h3>Glitch</h3>
                <div class="laptop-box" id="screen-glitch">Standby...</div>
            </div>
        </div>

        <div class="control-panel">
            <div class="chain-status-log" id="chain-log">সিস্টেম প্রস্তুত, বস। নিচে কমান্ড লিখুন।</div>
            <div class="input-box">
                <input type="text" id="user-input" placeholder="যেমন: Modern Portfolio Website..." onkeypress="if(event.key === 'Enter') runChain()">
                <button onclick="runChain()">চেইন স্টার্ট করুন</button>
            </div>
        </div>

        <div class="control-panel">
            <h3>👁️ প্রিমিয়াম লাইভ ওয়েবসাইট প্রিভিউ</h3>
            <div class="preview-box">
                <iframe id="web-preview" srcdoc="<h3 style='text-align:center; color:#666; margin-top:20%'>এখনো কোনো সাইট তৈরি হয়নি, বস।</h3>"></iframe>
            </div>
        </div>
    </div>

    <script>
        async function runChain() {
            const inputField = document.getElementById('user-input');
            const command = inputField.value.trim();
            const logBox = document.getElementById('chain-log');
            if (!command) return;

            logBox.innerHTML += `\n\n> **বস-এর কমান্ড:** "${command}"`;
            inputField.value = "";

            document.getElementById('desk-nexus').classList.add('active');
            logBox.innerHTML += `\n[Nexus & Team]: ব্যাকএন্ড থেকে এপিআই কি নিয়ে প্রসেস করা হচ্ছে...`;

            try {
                const response = await fetch('/api/run-chain', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                const data = await response.json();

                if(data.error) {
                    alert(data.error);
                    return;
                }

                logBox.innerHTML += `\n🧑‍💻 **Nexus:** ${data.nexus}`;
                logBox.innerHTML += `\n👩‍💻 **Cipher:** কোডিং সফলভাবে শেষ!`;
                logBox.innerHTML += `\n🤖 **Glitch:** ${data.glitch}`;
                logBox.innerHTML += `\n\n✨ **[সাকসেস]:** সাইট প্রিভিউ উইন্ডোতে লোড হয়েছে, বস!`;

                document.getElementById('web-preview').srcdoc = data.code;

                if ('speechSynthesis' in window) {
                    const speech = new SpeechSynthesisUtterance("চেইন প্রসেস সম্পন্ন হয়েছে, বস।");
                    speech.lang = 'bn-BD';
                    window.speechSynthesis.speak(speech);
                }
            } catch(e) {
                logBox.innerHTML += `\n❌ কানেকশনে সমস্যা হয়েছে!`;
            }

            document.querySelectorAll('.agent-desk').forEach(d => d.classList.remove('active'));
        }
    </script>
</body>
</html>
